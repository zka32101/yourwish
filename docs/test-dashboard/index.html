<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 テスト結果ダッシュボード</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .timestamp {
      color: #999;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .card h2 {
      color: #667eea;
      font-size: 18px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .metric:last-child {
      border-bottom: none;
    }

    .metric-name {
      font-weight: 500;
      color: #333;
    }

    .metric-value {
      font-size: 18px;
      font-weight: bold;
      color: #667eea;
    }

    .metric-unit {
      font-size: 12px;
      color: #999;
      margin-left: 5px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea, #764ba2);
      transition: width 0.3s ease;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status-pass {
      background: #d4edda;
      color: #155724;
    }

    .status-warning {
      background: #fff3cd;
      color: #856404;
    }

    .status-fail {
      background: #f8d7da;
      color: #721c24;
    }

    .chart-container {
      position: relative;
      height: 300px;
      margin-bottom: 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .summary-item {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .summary-label {
      color: #999;
      font-size: 12px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .summary-value {
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
    }

    footer {
      text-align: center;
      color: white;
      padding: 20px;
      margin-top: 30px;
    }

    .update-badge {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 テスト結果ダッシュボード</h1>
      <p class="timestamp">最終更新: <span id="timestamp"></span></p>
    </header>

    <!-- サマリー -->
    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">総テスト数</div>
        <div class="summary-value" id="total-tests">0</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">通過率</div>
        <div class="summary-value" id="pass-rate">0%</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">平均精度</div>
        <div class="summary-value" id="avg-accuracy">0%</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">ステータス</div>
        <div class="summary-value" id="overall-status">-</div>
      </div>
    </div>

    <!-- グラフ -->
    <div class="grid">
      <div class="card">
        <h2>📈 テスト通過率</h2>
        <div class="chart-container">
          <canvas id="test-chart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2>⚡ パフォーマンスメトリクス</h2>
        <div class="chart-container">
          <canvas id="performance-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- テスト詳細 -->
    <div class="grid">
      <div class="card">
        <h2>✅ テスト結果詳細</h2>
        <div id="test-details"></div>
      </div>

      <div class="card">
        <h2>⚙️ プロジェクトメトリクス</h2>
        <div id="project-metrics"></div>
      </div>
    </div>

    <footer>
      <div class="update-badge">
        🤖 自動生成: GitHub Actions
      </div>
      <p style="margin-top: 10px;">
        生成日時: <span id="footer-time"></span>
      </p>
    </footer>
  </div>

  <script>
    // メトリクスを読み込み
    async function loadMetrics() {
      try {
        const response = await fetch('metrics.json');
        const data = await response.json();
        renderDashboard(data);
      } catch (error) {
        console.error('メトリクス読み込みエラー:', error);
        document.body.innerHTML = '<h1>エラー: メトリクスを読み込めません</h1>';
      }
    }

    function renderDashboard(data) {
      const timestamp = new Date(data.timestamp);
      document.getElementById('timestamp').textContent = timestamp.toLocaleString('ja-JP');
      document.getElementById('footer-time').textContent = timestamp.toLocaleString('ja-JP');

      // テスト結果を処理
      const tests = data.tests || {};
      const testNames = Object.keys(tests);
      const testValues = Object.values(tests);

      const totalTests = testNames.length;
      const avgPass = Math.round(testValues.reduce((a, b) => a + b, 0) / totalTests);

      document.getElementById('total-tests').textContent = totalTests;
      document.getElementById('pass-rate').textContent = avgPass + '%';
      document.getElementById('avg-accuracy').textContent = avgPass + '%';
      document.getElementById('overall-status').textContent = avgPass >= 90 ? '✅ 良好' : '⚠️ 要確認';

      // テスト詳細
      const testDetails = document.getElementById('test-details');
      testNames.forEach((name, idx) => {
        const value = testValues[idx];
        const statusClass = value >= 90 ? 'status-pass' : value >= 70 ? 'status-warning' : 'status-fail';
        const statusText = value >= 90 ? '合格' : value >= 70 ? '警告' : '失敗';

        testDetails.innerHTML += `
          <div class="metric">
            <span class="metric-name">${name}</span>
            <span class="metric-value">${value}%</span>
          </div>
