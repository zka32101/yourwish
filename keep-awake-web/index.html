<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep Awake</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0071e3;
    --ok: #1e8e3e;
    --warn: #b3261e;
    --border: #d2d2d7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --muted: #9a9a9e;
      --accent: #4da3ff;
      --ok: #4ade80;
      --warn: #ff6b6b;
      --border: #3a3a3c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    text-align: center;
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; }
  .status {
    font-size: 0.95rem;
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    min-height: 1.4em;
  }
  .status.active { color: var(--ok); }
  .status.inactive { color: var(--muted); }
  .status.error { color: var(--warn); }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: var(--accent);
    color: white;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.9; }
  button.stop { background: var(--warn); }
  .log {
    margin-top: 20px;
    text-align: left;
    font-size: 0.75rem;
    color: var(--muted);
    max-height: 140px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .log div { margin-bottom: 2px; }
  .note {
    margin-top: 18px;
    font-size: 0.75rem;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Keep Awake</h1>
    <p class="sub">このタブを開いている間、画面のスリープ・ロックを防止します</p>
    <div id="status" class="status inactive">停止中</div>
    <button id="toggle">開始する</button>
    <div id="log" class="log"></div>
    <div class="note">
      Wake Lock API を使用します。インストールは不要で、対応ブラウザ（Chrome / Edge など）でこのページを開くだけで動作します。<br>
      3分ごとに内部でキープアライブ処理を実行し、ロックが解除された場合は自動的に再取得します。<br>
      ※ ブラウザの仕様上、他のアプリへ実際のキー入力を送ることはできません（画面スリープ・ロックの防止のみ）。
    </div>
  </div>

<script>
(() => {
  const KEEPALIVE_INTERVAL_MS = 3 * 60 * 1000; // 3分
  const statusEl = document.getElementById('status');
  const toggleBtn = document.getElementById('toggle');
  const logEl = document.getElementById('log');

  let wakeLock = null;
  let keepAliveTimer = null;
  let running = false;

  function log(msg) {
    const t = new Date().toLocaleTimeString('ja-JP', { hour12: false });
    const line = document.createElement('div');
    line.textContent = `[${t}] ${msg}`;
    logEl.prepend(line);
    while (logEl.childNodes.length > 30) logEl.removeChild(logEl.lastChild);
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = `status ${cls}`;
  }

  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) {
      throw new Error('このブラウザは Wake Lock API に対応していません');
    }
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => {
      log('Wake Lock が解放されました');
      if (running) reacquireIfNeeded();
    });
    log('Wake Lock を取得しました');
  }

  async function reacquireIfNeeded() {
    if (!running) return;
    if (document.visibilityState !== 'visible') return; // タブが非表示の間は取得できない
    try {
      await acquireWakeLock();
    } catch (e) {
      log(`再取得エラー: ${e.message}`);
    }
  }

  function keepAliveTick() {
    // 3分ごとのキープアライブ: Wake Lock の状態確認＋簡易なDOM操作でアクティビティを発生させる
    log('キープアライブ実行');
    document.title = document.title === 'Keep Awake' ? 'Keep Awake •' : 'Keep Awake';
    if (!wakeLock || wakeLock.released) {
      reacquireIfNeeded();
    }
  }

  async function start() {
    try {
      await acquireWakeLock();
      running = true;
      setStatus('稼働中（スリープ防止 ON）', 'active');
      toggleBtn.textContent = '停止する';
      toggleBtn.classList.add('stop');
      keepAliveTimer = setInterval(keepAliveTick, KEEPALIVE_INTERVAL_MS);
    } catch (e) {
      setStatus(`エラー: ${e.message}`, 'error');
      log(`エラー: ${e.message}`);
    }
  }

  async function stop() {
    running = false;
    if (keepAliveTimer) clearInterval(keepAliveTimer);
    keepAliveTimer = null;
    if (wakeLock) {
      try { await wakeLock.release(); } catch (_) {}
      wakeLock = null;
    }
    setStatus('停止中', 'inactive');
    toggleBtn.textContent = '開始する';
    toggleBtn.classList.remove('stop');
    log('停止しました');
  }

  toggleBtn.addEventListener('click', () => {
    running ? stop() : start();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) {
      reacquireIfNeeded();
    }
  });
})();
</script>
</body>
</html>
