name: CI (viewer_vote_survival)

# モノレポ構成: apps/viewer_vote_survival/ または
# 依存している packages/sns_live_game_kit/ の変更時のみ起動する。
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/viewer_vote_survival/**'
      - 'packages/sns_live_game_kit/**'
  pull_request:
    paths:
      - 'apps/viewer_vote_survival/**'
      - 'packages/sns_live_game_kit/**'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/flutter-app-ci.yml
    with:
      app-path: apps/viewer_vote_survival
