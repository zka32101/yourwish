name: CI (viewer_vote_survival)

# モノレポ構成: apps/viewer_vote_survival/ 配下の変更のみで起動する。
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/viewer_vote_survival/**'
  pull_request:
    paths:
      - 'apps/viewer_vote_survival/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/viewer_vote_survival

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
