name: Emulator Test (prefecture_defense)

on:
  push:
    branches: [master, main]
    paths:
      - 'apps/prefecture_defense/**'
      - 'packages/game_kit/**'
  pull_request:
    paths:
      - 'apps/prefecture_defense/**'
      - 'packages/game_kit/**'
  workflow_dispatch:

jobs:
  emulator-test:
    uses: ./.github/workflows/android-emulator-test.yml
    with:
      app-path: apps/prefecture_defense
      test-command: flutter test
