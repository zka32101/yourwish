name: CI (sns_live_game_kit)

# 共通パッケージ自体のCI。ここが壊れると依存する全ゲームに影響するため、
# packages/sns_live_game_kit/ の変更時に単独で検証する。
on:
  push:
    branches: [master, main]
    paths:
      - 'packages/sns_live_game_kit/**'
  pull_request:
    paths:
      - 'packages/sns_live_game_kit/**'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/flutter-app-ci.yml
    with:
      app-path: packages/sns_live_game_kit
