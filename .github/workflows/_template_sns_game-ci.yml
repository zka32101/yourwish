name: CI (_template_sns_game)

# apps/_template_sns_game/ または依存している packages/sns_live_game_kit/
# の変更時のみ起動する。scripts/new_sns_game.sh はこのファイルをコピーして
# 新しい環境のCIを生成する（コピー先では _template_sns_game の部分が
# 新しいゲーム名に置き換わる）。
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/_template_sns_game/**'
      - 'packages/sns_live_game_kit/**'
  pull_request:
    paths:
      - 'apps/_template_sns_game/**'
      - 'packages/sns_live_game_kit/**'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/flutter-app-ci.yml
    with:
      app-path: apps/_template_sns_game
