  #   if: |
  #     github.event_name == 'push' &&
  #     (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
  #
  #   strategy:
  #     matrix:
  #       app:
  #         - vote_survivor
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #
  #     - name: Build and push web image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         file: ./Dockerfile.web
  #         push: false
  #         build-args: |
  #           APP_NAME=${{ matrix.app }}
  #           BUILD_MODE=release
  #         tags: |
  #           yourwish-web:latest
  #           yourwish-web:${{ github.sha }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max
  #         outputs: type=docker,dest=/tmp/web-image.tar
  #
  #     - name: Upload web artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: web-image-${{ matrix.app }}
  #         path: /tmp/web-image.tar
  #         retention-days: 7

  # ========================
  # ジョブ5: Docker イメージビルド（Android）
  # ========================
  # NOTE: vote_survivor は既存コード問題があるため、現在は無効化
  # 将来的に vote_survivor のコード修正後、このジョブを再度有効化予定
  # build-android:
  #   name: Build Android APK
  #   needs: [lint, test]
  #   runs-on: ubuntu-latest
  #   if: |
  #     github.event_name == 'push' &&
  #     (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
  #
  #   strategy:
  #     matrix:
  #       app:
  #         - vote_survivor
  #
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@v4
  #
  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3
  #
  #     - name: Build Android APK
