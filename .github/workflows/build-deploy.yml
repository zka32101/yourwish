  #         context: .
  #         file: ./Dockerfile.android
  #         push: false
  #         build-args: |
  #           APP_NAME=${{ matrix.app }}
  #           BUILD_MODE=release
  #         tags: |
  #           yourwish-android:latest
  #           yourwish-android:${{ github.sha }}
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max
  #         outputs: type=docker,dest=/tmp/android-image.tar
  #
  #     - name: Upload Android artifact
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: android-image-${{ matrix.app }}
  #         path: /tmp/android-image.tar
  #         retention-days: 7

  # ========================
  # ジョブ5.5: Android App Bundle ビルド
  # ========================
  build-aab:
    name: Build Android App Bundle
    needs: [lint, test]
    runs-on: ubuntu-latest
    # PR でも実行する: master にマージする前に AAB ビルドの成否を検証するため
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))

    strategy:
      matrix:
        app:
          - vote_survivor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.1 は Java 17 を要求する。runner のデフォルト JDK に依存しないよう固定する
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Debug Flutter environment
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "=== Flutter Environment Debug ==="
          which flutter
          flutter --version
          java -version 2>&1
          echo "JAVA_HOME: $JAVA_HOME"
          echo "FLUTTER_ROOT: $FLUTTER_ROOT"
          echo "FLUTTER_HOME: $FLUTTER_HOME"
          echo "FLUTTER_SDK: $FLUTTER_SDK"
          echo "PATH: $PATH"
          ls -la android/local.properties 2>/dev/null || echo "No local.properties found"

      - name: Create local.properties for Android build
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "=== Creating local.properties ==="
          # Try different Flutter SDK paths
          if [ -n "$FLUTTER_ROOT" ]; then
            FLUTTER_SDK_PATH="$FLUTTER_ROOT"
          elif [ -n "$FLUTTER_HOME" ]; then
            FLUTTER_SDK_PATH="$FLUTTER_HOME"
          elif command -v flutter &> /dev/null; then
            FLUTTER_SDK_PATH="$(dirname $(dirname $(which flutter)))"
          else
            echo "ERROR: Flutter SDK not found!"
            exit 1
          fi

          echo "flutter.sdk=$FLUTTER_SDK_PATH" > local.properties
          echo "Created local.properties with Flutter SDK: $FLUTTER_SDK_PATH"
          cat local.properties

      # gradle-wrapper.jar はリポジトリにコミットされていない。JAR が無いと gradlew は
      # gradle-wrapper.properties を無視し、runner の system Gradle (9.x) が使われてしまう。
      # Gradle 9 は AGP 7.x/8.x と非互換なため、wrapper を確実に用意する。
      - name: Ensure Gradle wrapper JAR
        working-directory: apps/${{ matrix.app }}/android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing; generating one"
            GRADLE_VERSION=$(sed -n 's|.*/gradle-\(.*\)-all\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
            echo "target Gradle version: $GRADLE_VERSION"
            TMP=$(mktemp -d)
            # Gradle は「Gradle ビルド」でないディレクトリでは wrapper タスクを実行できないため、
            # 空の settings.gradle を置いて最小構成のビルドに見せる
            touch "$TMP/settings.gradle"
            (cd "$TMP" && gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all -q)
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            cp "$TMP/gradlew" gradlew
            chmod +x gradlew
            rm -rf "$TMP"
          fi

      - name: Debug Gradle setup
        working-directory: apps/${{ matrix.app }}/android
        run: |
          echo "=== wrapper dir ==="
          ls -la gradle/wrapper/ || true
          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties || true
          echo "=== gradlew present? ==="
          ls -la gradlew || echo "no gradlew"
          echo "=== gradle version actually used by wrapper ==="
          ./gradlew --version 2>&1 | head -20 || echo "gradlew invocation failed"
          echo "=== system gradle (fallback candidate) ==="
          which gradle && gradle --version 2>&1 | head -12 || echo "no system gradle on PATH"

      - name: Build Android App Bundle
        working-directory: apps/${{ matrix.app }}
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: aab-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/bundle/release/
          retention-days: 7

  # ========================
  # ジョブ6: パッケージテスト
  # ========================
  test-packages:
    name: Test Packages
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Test game_kit
        working-directory: packages/game_kit
        run: |
          flutter pub get
          flutter test
          echo "✓ game_kit tests passed"

  # ========================
  # ジョブ7: デプロイメント
  # ========================
  deploy:
    name: Deploy
    needs: [build-aab, test-packages]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Display artifacts
        run: |
          echo "=== Build Artifacts ==="
          ls -lh artifacts/ 2>/dev/null || echo "No artifacts found"

      - name: Deploy notification
        run: |
          echo "✓ Deployment complete!"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Next steps:"
          echo "1. AAB (Android App Bundle) artifacts available in GitHub Actions"
          echo "2. Deploy to Google Play Store"
          echo "3. Run post-deployment smoke tests"

  # ========================
  # ジョブ8: ビルド成功レポート
  # ========================
  summary:
    name: Build Summary
    needs: [lint, test, test-packages, build-aab]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate summary
        run: |
          echo "# 🚀 Build & Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint (sns_game_template) | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test (sns_game_template) | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages | ${{ needs.test-packages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Build (AAB) | ${{ needs.build-aab.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $([ \"${{ needs.lint.result }}\" = \"success\" ] && [ \"${{ needs.test.result }}\" = \"success\" ] && [ \"${{ needs.test-packages.result }}\" = \"success\" ] && echo \"✅ All checks passed\" || echo \"⚠️ Some checks failed\")" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
