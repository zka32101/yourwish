name: Build & Deploy (No Local Environment Required)

# トリガー条件
on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master

  # 手動実行オプション
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Build target (flutter, android, web, packages)'
        required: true
        default: 'flutter'
        type: choice
        options:
          - flutter
          - android
          - web
          - packages
      build_mode:
        description: 'Build mode (debug, release)'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

# 環境変数
env:
  REGISTRY: ghcr.io
  DOCKER_BUILDKIT: 1

jobs:
  # ========================
  # ジョブ1: ビルド環境チェック
  # ========================
  setup:
    name: Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      build-target: ${{ steps.setup.outputs.build-target }}
      build-mode: ${{ steps.setup.outputs.build-mode }}
      docker-available: ${{ steps.setup.outputs.docker-available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        id: setup
        run: |
          echo "build-target=${{ github.event.inputs.build_target || 'flutter' }}" >> $GITHUB_OUTPUT
          echo "build-mode=${{ github.event.inputs.build_mode || 'release' }}" >> $GITHUB_OUTPUT
          echo "docker-available=true" >> $GITHUB_OUTPUT
          echo "===== Build Setup ====="
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "Build Target: ${{ github.event.inputs.build_target || 'flutter' }}"

  # ========================
  # ジョブ2: Lint & Analyze
  # ========================
  lint:
    name: Lint & Analyze
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - sns_game_template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Run analysis
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "✓ Lint passed: ${{ matrix.app }}"

  # ========================
  # ジョブ3: テスト実行
  # ========================
  test:
    name: Run Tests
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - sns_game_template

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Get dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: |
          flutter test
          echo "✓ Tests passed: ${{ matrix.app }}"

  # ========================
  # ジョブ4: Docker イメージビルド（Web）
  # ========================
  # NOTE: vote_survivor は既存コード問題があるため、現在は無効化
