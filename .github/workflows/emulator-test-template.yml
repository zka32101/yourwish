# Android エミュレータテスト テンプレート（クラウド完結）
#
# ローカル環境・実機を使わず、GitHub Actions 上の Android エミュレータで
# build-and-test スキルの6観点を検証する。
#
# 各アプリのリポジトリへ .github/workflows/emulator-test.yml としてコピーして使う。
# 詳細は yourwish/.claude/skills/orchestrator/SKILL.md（v2.0 全自動運用）を参照。

name: Emulator Test

on:
  push:
    branches: ['main', 'master', 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ==========================================
  # 静的検証（エミュレータ不要・高速）
  # ==========================================
  static:
    name: Analyze & Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit test
        run: flutter test --reporter expanded
        continue-on-error: true

  # ==========================================
  # エミュレータ 6観点テスト
  # ==========================================
  emulator:
    name: Emulator 6-Perspective Test
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # KVM を有効化しないとエミュレータが極端に遅くなる
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api29

      - name: Create AVD snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Run 6-perspective test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/emulator-6check.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-results
          path: |
            build/reports/**
            *.log
            screenshots/**
          if-no-files-found: ignore

  # ==========================================
  # 結果サマリー
  # ==========================================
  summary:
    name: Summary
    needs: [static, emulator]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          {
            echo "## エミュレータテスト結果"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|------|------|"
            echo "| 静的検証 (analyze/unit) | ${{ needs.static.result == 'success' && '✅' || '❌' }} |"
            echo "| エミュレータ6観点 | ${{ needs.emulator.result == 'success' && '✅' || '❌' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if emulator test failed
        if: needs.emulator.result == 'failure'
        run: exit 1
