# 10観点デバイステスト テンプレート（クラウド完結）
#
# 旧「6観点」エミュレータテストは廃止し、shared_core の共通ワークフロー
# zka32101/shared_core/.github/workflows/device-test.yml（Android エミュレータ + iOS シミュレータ）に統一した。
# 方針: shared_core docs/DEVICE_TEST_POLICY.md（§1 10観点 / §11 iOS）
#
# 各アプリへの導入は手作業不要: ship-cycle の `ship.sh`（または `bootstrap-tests.sh`）が
# 未導入のアプリに .github/workflows/device-test.yml と integration_test を自動生成する。
#
# モノレポ(yourwish)のルートには pubspec.yaml が無いため、ここでは手動実行のみ。
# apps/<app> を対象にする場合は working_directory を指定する。
name: Device Test 10 (template)

on:
  workflow_dispatch:
    inputs:
      working_directory:
        description: '対象アプリ（例: apps/vote_survivor）'
        required: true
        type: string
      ios:
        type: boolean
        default: false

jobs:
  device-test:
    uses: zka32101/shared_core/.github/workflows/device-test.yml@main
    with:
      working_directory: ${{ inputs.working_directory }}
      ios: ${{ inputs.ios }}
