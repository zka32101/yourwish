name: CI (shoukoku_shinshin)

# apps/shoukoku_shinshin/ または依存している packages/game_kit/
# の変更時のみ起動する。scripts/new_sns_game.sh はこのファイルをコピーして
# 新しい環境のCIを生成する（コピー先では shoukoku_shinshin の部分が
# 新しいゲーム名に置き換わる）。
on:
  push:
    branches: [master, main]
    paths:
      - 'apps/shoukoku_shinshin/**'
      - 'packages/game_kit/**'
  pull_request:
    paths:
      - 'apps/shoukoku_shinshin/**'
      - 'packages/game_kit/**'
  workflow_dispatch:

jobs:
  ci:
    uses: ./.github/workflows/flutter-app-ci.yml
    with:
      app-path: apps/shoukoku_shinshin
