name: Build and Deploy APK (prefecture_defense)

on:
  push:
    tags:
      - 'geography-puzzle-king-v*'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: apps/prefecture_defense

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      # gradle-wrapper.jar がリポジトリにコミットされていない場合、gradlew は
      # gradle-wrapper.properties を無視して runner の system Gradle にフォールバックし、
      # プロジェクトが要求するバージョンと食い違って失敗する (vote_survivor で確認済みの問題)。
      - name: Ensure Gradle wrapper JAR
        working-directory: apps/prefecture_defense/android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is missing; generating one"
            GRADLE_VERSION=$(sed -n 's|.*/gradle-\(.*\)-all\.zip|\1|p' gradle/wrapper/gradle-wrapper.properties)
            echo "target Gradle version: $GRADLE_VERSION"
            TMP=$(mktemp -d)
            touch "$TMP/settings.gradle"
            (cd "$TMP" && gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all -q)
            cp "$TMP/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/gradle-wrapper.jar
            rm -rf "$TMP"
          fi

      - name: Debug Gradle setup
        working-directory: apps/prefecture_defense/android
        run: |
          java -version 2>&1
          ./gradlew --version 2>&1 | head -15 || echo "gradlew invocation failed"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geography-puzzle-king-apk
          path: apps/prefecture_defense/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
