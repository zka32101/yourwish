name: Build and Deploy APK (prefecture_defense)

on:
  push:
    tags:
      - 'geography-puzzle-king-v*'

defaults:
  run:
    working-directory: apps/prefecture_defense

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geography-puzzle-king-apk
          path: apps/prefecture_defense/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
