<!DOCTYPE html>
<html>
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A Flutter app for viewing and voting in survival games.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="vote_survivor">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <title>vote_survivor</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('flutter-first-frame', function () {
                navigator.serviceWorker.register('flutter_service_worker.js?v=%FLUTTER_BUILD_ID%');
            });
        }
    </script>
    <script src="main.dart.js" type="application/javascript"></script>
</body>
</html>
