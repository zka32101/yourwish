pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        def propertiesFile = new File(rootDir.parentFile, '.flutter-plugins')
        if (propertiesFile.exists()) {
            properties.load(propertiesFile.newReader())
        }
        properties.getProperty('flutter.sdk', null)
    }
    def flutterSdkPath_env = System.getenv("FLUTTER_ROOT")
    def flutterSdkPath = flutterSdkPath_env == null ? flutterSdkPath() : flutterSdkPath_env

    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
}

plugins {
    id "dev.flutter.flutter-gradle-plugin" version "1.0.0" apply false
}

include ':app'

def localPropertiesFile = new File(rootDir, 'local.properties')
def properties = new Properties()

if (localPropertiesFile.exists()) {
    properties.load(localPropertiesFile.newReader())
}

def flutterSdkPath = properties.getProperty('flutter.sdk')
if (flutterSdkPath == null) {
    flutterSdkPath = System.getenv("FLUTTER_ROOT")
}
if (flutterSdkPath == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

gradle.ext.flutterSdkPath = flutterSdkPath
