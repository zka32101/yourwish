version: '3.9'

services:
  claude:
    image: node:20-alpine
    container_name: yourwish-claude-code
    working_dir: /workspace
    volumes:
      # Claude Code セッション・認証情報の永続化
      - ./claude-home:/home/node/.claude
      # プロジェクトソースコード
      - .:/workspace
      # npm キャッシュの永続化（インストール高速化）
      - npm-cache:/home/node/.npm
      # npm グローバルパッケージ（node_modules）の永続化
      - npm-global:/home/node/.npm-global
    environment:
      # npm グローバルインストール用
      - NPM_CONFIG_PREFIX=/home/node/.npm-global
      - PATH=/home/node/.npm-global/bin:$PATH
      # Node.js メモリ効率化（自動GC）
      - NODE_OPTIONS=--max-old-space-size=${NODE_MAX_MEMORY:-512} --max-http-header-size=16384
      # npm キャッシュ設定
      - npm_config_cache=/home/node/.npm
      - npm_config_prefer_offline=true
    ports:
      # Claude Code CLI、各ゲーム開発サーバー用
      - "3000-3100:3000-3100"
      # デバッガー、その他の開発ツール
      - "5900-5910:5900-5910"
    # メモリベースのテンポラリストレージ（高速）
    tmpfs:
      - /tmp
      - /home/node/.cache
    # リソース制限（ホストマシンを保護）
    deploy:
      resources:
        limits:
          cpus: ${CLAUDE_CPU_LIMIT:-"2.0"}
          memory: ${CLAUDE_MEMORY_LIMIT:-1G}
        reservations:
          cpus: ${CLAUDE_CPU_RESERVE:-"1.0"}
          memory: ${CLAUDE_MEMORY_RESERVE:-512M}
    stdin_open: true
    tty: true
    command: /bin/sh
    # ホストのユーザー ID を使用してファイル権限問題を回避
    user: "node"

  # Flutter ビルド環境（APK/AAB 生成用）
  flutter:
    image: cirrusci/flutter:latest
    container_name: yourwish-flutter-build
    working_dir: /workspace
    volumes:
      # プロジェクトソースコード
      - .:/workspace
      # Gradle キャッシュ（高速ビルド）
      - gradle-cache:/root/.gradle
      # Flutter キャッシュ
      - flutter-cache:/root/.flutter_cache
    environment:
      # Flutter 設定
      - FLUTTER_HOME=/opt/flutter
      - PATH=/opt/flutter/bin:/opt/flutter/bin/cache/dart-sdk/bin:$PATH
      # Android SDK 設定
      - ANDROID_HOME=/opt/android-sdk-linux
      # Java 設定（Gradle ビルドに必須）
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - JAVA_TOOL_OPTIONS=-Xmx1g
    ports:
      # ビルドサーバー・デバッガー用
      - "8080-8090:8080-8090"
    stdin_open: true
    tty: true
    command: /bin/bash
    user: "root"

volumes:
  # npm パッケージキャッシュ（ディスクベース・永続化）
  npm-cache:
    driver: local
  # npm グローバルパッケージ（ディスクベース・永続化）
  npm-global:
    driver: local
  # Gradle キャッシュ（高速ビルド）
  gradle-cache:
    driver: local
  # Flutter キャッシュ
  flutter-cache:
    driver: local
